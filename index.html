<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Creative - AI Signage Design</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [productType, setProductType] = useState('acp');
            const [width, setWidth] = useState(4);
            const [height, setHeight] = useState(4);
            const [letters, setLetters] = useState(1);
            
            // Pricing Logic
            const rates = { acp: 599, acrylic: 100 };
            
            let basePrice = 0;
            if (productType === 'acp') {
                basePrice = width * height * rates.acp;
            } else if (productType === 'acrylic') {
                let size = Number(height);
                // Agar width barabar ya zyada hai toh double judega
                if (Number(width) >= Number(height)) {
                    size = Number(height) + Number(width);
                }
                basePrice = size * letters * rates.acrylic;
            }

            const gst = basePrice * 0.18;
            const total = basePrice + gst;
            const advance = total * 0.50;

            return (
                <div class="min-h-screen bg-slate-900 pb-20">
                    {/* Header */}
                    <header class="border-b border-slate-800 bg-slate-950 p-4 sticky top-0 z-50">
                        <div class="max-w-6xl mx-auto flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center font-bold text-xl shadow-[0_0_15px_rgba(6,182,212,0.5)]">GC</div>
                                <div>
                                    <h1 class="font-bold text-lg leading-tight">GLOBAL CREATIVE</h1>
                                    <p class="text-xs text-cyan-400">AI SIGNAGE DESIGNER</p>
                                </div>
                            </div>
                            <a href="https://wa.me/919211880426" target="_blank" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-full text-sm font-semibold transition-all">WhatsApp Order</a>
                        </div>
                    </header>

                    <main class="max-w-6xl mx-auto p-4 mt-8 grid md:grid-cols-2 gap-8">
                        {/* Left Column: AI Studio & Manual Draw */}
                        <div class="space-y-6">
                            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl">
                                <h2 class="text-xl font-bold mb-2 flex items-center gap-2 text-yellow-400">
                                    <i data-lucide="sparkles"></i> Design Studio
                                </h2>
                                <p class="text-sm text-slate-400 mb-6">Create via AI, draw manually, or upload your CDR/PDF files.</p>
                                
                                <div class="grid grid-cols-3 gap-3 mb-6">
                                    <button class="bg-slate-800 hover:bg-slate-700 py-3 rounded-lg text-sm border border-slate-700 transition-all flex flex-col items-center justify-center gap-2">
                                        <i data-lucide="square"></i> Draw Box
                                    </button>
                                    <button class="bg-slate-800 hover:bg-slate-700 py-3 rounded-lg text-sm border border-slate-700 transition-all flex flex-col items-center justify-center gap-2">
                                        <i data-lucide="pen-tool"></i> Pen Tool
                                    </button>
                                    <button class="bg-slate-800 hover:bg-slate-700 py-3 rounded-lg text-sm border border-slate-700 transition-all flex flex-col items-center justify-center gap-2">
                                        <i data-lucide="type"></i> Add Text
                                    </button>
                                </div>

                                <div class="relative">
                                    <textarea placeholder="Describe your design (e.g., '10x3 ft gold acrylic 3D letters for a cafe')..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 min-h-[120px] focus:outline-none focus:border-cyan-500 resize-none text-sm"></textarea>
                                    <div class="absolute bottom-3 right-3 flex gap-2">
                                        <button class="p-2 bg-slate-800 rounded-full hover:bg-slate-700 text-slate-300 border border-slate-600"><i data-lucide="upload" class="w-4 h-4"></i></button>
                                        <button class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 rounded-full text-sm font-bold shadow-[0_0_15px_rgba(6,182,212,0.4)]">Generate</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Right Column: Rate Calculator */}
                        <div class="space-y-6">
                            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl">
                                <h2 class="text-xl font-bold mb-6">Manufacturing Quote</h2>
                                
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm text-slate-400 mb-1">Select Product</label>
                                        <select value={productType} onChange={(e) => setProductType(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-500">
                                            <option value="acp">ACP Sign Board (₹599/sq.ft)</option>
                                            <option value="acrylic">3D Acrylic Letters/Logo (₹100/inch)</option>
                                        </select>
                                    </div>

                                    {productType === 'acp' ? (
                                        <div class="grid grid-cols-2 gap-4">
                                            <div>
                                                <label class="block text-sm text-slate-400 mb-1">Width (Feet)</label>
                                                <input type="number" value={width} onChange={(e) => setWidth(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-500" />
                                            </div>
                                            <div>
                                                <label class="block text-sm text-slate-400 mb-1">Height (Feet)</label>
                                                <input type="number" value={height} onChange={(e) => setHeight(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-500" />
                                            </div>
                                        </div>
                                    ) : (
                                        <div class="grid grid-cols-3 gap-4">
                                            <div>
                                                <label class="block text-sm text-slate-400 mb-1">Height (Inch)</label>
                                                <input type="number" value={height} onChange={(e) => setHeight(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-500" />
                                            </div>
                                            <div>
                                                <label class="block text-sm text-slate-400 mb-1">Width (Inch)</label>
                                                <input type="number" value={width} onChange={(e) => setWidth(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-500" />
                                            </div>
                                            <div>
                                                <label class="block text-sm text-slate-400 mb-1">Total Letters</label>
                                                <input type="number" value={letters} onChange={(e) => setLetters(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-cyan-500" />
                                            </div>
                                        </div>
                                    )}

                                    <div class="mt-6 border-t border-slate-800 pt-4 space-y-2">
                                        <div class="flex justify-between text-sm text-slate-400">
                                            <span>Base Price</span>
                                            <span>₹{basePrice.toLocaleString('en-IN')}</span>
                                        </div>
                                        <div class="flex justify-between text-sm text-slate-400">
                                            <span>GST (18%)</span>
                                            <span>₹{gst.toLocaleString('en-IN', {maximumFractionDigits: 0})}</span>
                                        </div>
                                        <div class="flex justify-between text-lg font-bold text-white pt-2 border-t border-slate-800">
                                            <span>Total (Inc. GST)</span>
                                            <span>₹{total.toLocaleString('en-IN', {maximumFractionDigits: 0})}</span>
                                        </div>
                                    </div>

                                    <div class="bg-yellow-500/10 border border-yellow-500/50 rounded-lg p-4 mt-6">
                                        <div class="flex justify-between items-center">
                                            <div>
                                                <h4 class="font-bold text-yellow-500">50% Advance Required</h4>
                                                <p class="text-xs text-slate-400 mt-1">To confirm order & begin production</p>
                                            </div>
                                            <span class="text-xl font-black text-yellow-400">₹{advance.toLocaleString('en-IN', {maximumFractionDigits: 0})}</span>
                                        </div>
                                    </div>

                                    <p class="text-[11px] text-slate-500 mt-4 leading-relaxed">
                                        * Worldwide Delivery Available. Delivery charges (Courier/Transport) depend on location. The remaining 50% balance + delivery charges are payable upon dispatch/delivery.
                                    </p>

                                    <button class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-4 rounded-xl mt-4 transition-all">
                                        Pay 50% Advance & Confirm
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Initialize Icons
        setTimeout(() => {
            lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
