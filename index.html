    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            // State variables for the calculator
            const [productType, setProductType] = useState('acp');
            const [width, setWidth] = useState(4);

            const [letters, setLetters] = useState(1);
            
            // Core Pricing Logic based on user instructions
            const rates = { acp: 599, acrylic: 100 };
            
            let basePrice = 0;

                // Square Feet Logic: Width (ft) x Height (ft) x Rate
                basePrice = Number(width) * Number(height) * rates.acp;

                // Inch Logic for 3D Letters
                let size = Number(height);
                
                // Rule: If width is equal to or greater than height (e.g., 20x20), size doubles (height + width)
                if (Number(width) >= Number(height)) {
                    size = Number(height) + Number(width);
                }
                
                // Total price = Size (inches) * Number of Letters * Rate per inch
                basePrice = size * Number(letters) * rates.acrylic;

            const gst = basePrice * 0.18;
            const total = basePrice + gst;

                                <div className="grid grid-cols-3 gap-3 mb-6">

                                            Create Design
                                        </button>
                                    </div>
                                </div>
                            </div>

                                <h2 className="text-xl font-bold mb-6 text-white relative z-10">Live Manufacturing Quote</h2>
                                
                                <div className="space-y-5 relative z-10">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-400 mb-2">Select Material / Job</label>
                                        <select

                                                <input type="number" min="1" value={height} onChange={(e) => setHeight(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded-lg p-3.5 text-white text-sm focus:outline-none focus:border-brand-highlight" />
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-400 mb-2">Height (Inch)</label>
                                                <input type="number" min="1" value={height} onChange={(e) => setHeight(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded-lg p-3.5 text-white text-sm focus:outline-none focus:border-brand-highlight" />
                                            </div>

                                                <input type="number" min="1" value={width} onChange={(e) => setWidth(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded-lg p-3.5 text-white text-sm focus:outline-none focus:border-brand-highlight" />

                                                <input type="number" min="1" value={letters} onChange={(e) => setLetters(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded-lg p-3.5 text-white text-sm focus:outline-none focus:border-brand-highlight" />

                                        </div>
                                        <div className="flex justify-between text-sm text-slate-300">
                                            <span>GST Extra (18%)</span>
                                            <span className="font-medium text-red-400">+ ₹{gst.toLocaleString('en-IN', {maximumFractionDigits: 0})}</span>
                                        </div>
                                        <div className="flex justify-between text-xl font-bold text-white pt-3 border-t border-slate-700">
                                            <span>Total Value</span>
                                            <span className="text-brand-highlight">₹{total.toLocaleString('en-IN', {maximumFractionDigits: 0})}</span>
                                        </div>
                                    </div>

                                    <div className="bg-[#1e293b] border-2 border-emerald-500/30 rounded-xl p-5 mt-6 shadow-[0_0_20px_rgba(16,185,129,0.1)]">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <h4 className="font-bold text-emerald-400 text-lg">50% Advance</h4>
                                                <p className="text-xs text-slate-400 mt-1">Required to begin production</p>
                                            </div>
                                            <span className="text-2xl font-black text-white">₹{advance.toLocaleString('en-IN', {maximumFractionDigits: 0})}</span>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 p-4 rounded-lg border border-slate-700 mt-4">
                                        <p className="text-xs text-slate-400 leading-relaxed">
                                            <strong className="text-white">Delivery Terms:</strong> Worldwide Delivery Available. Delivery charges (Courier or Transport Company) depend on your location. <br/><br/>
                                            <span className="text-brand-highlight">The remaining 50% balance + delivery charges must be paid before dispatch to your address.</span>
                                        </p>
                                    </div>

                                    <button className="w-full bg-white hover:bg-gray-100 text-brand-dark font-black py-4 rounded-xl mt-2 transition-all shadow-lg flex items-center justify-center gap-2">
                                        Confirm & Pay Advance
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
