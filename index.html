<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesignHub Global | AI Architecture & Signage</title>
    <style>
        /* Ultra Bold Global Theme */
        :root {
            --bg-deep: #000000; --bg-panel: #0f172a; --bg-glass: rgba(15, 23, 42, 0.95);
            --gold: #facc15; --neon-blue: #38bdf8; --neon-red: #ef4444; --text-main: #ffffff;
            --paypal: #00457C; --upi: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', Impact, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); text-transform: uppercase; }
        
        /* Perfectly Symmetrical Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: var(--bg-glass); border-bottom: 3px solid #1e293b; position: sticky; top: 0; z-index: 1000; }
        .brand-logo { font-size: 36px; letter-spacing: 2px; }
        .brand-logo span { color: var(--gold); }
        
        .header-controls { display: flex; gap: 15px; align-items: center; }
        .select-box { background: #1e293b; color: white; border: 2px solid #334155; padding: 12px 15px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; outline: none; }
        .btn-google { background: #ffffff; color: #000000; border: none; padding: 12px 25px; border-radius: 6px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-google:hover { background: var(--neon-blue); }

        /* Studio Layout */
        .ultimate-studio { max-width: 1800px; margin: 40px auto; padding: 0 2%; display: grid; grid-template-columns: 450px 1fr; gap: 25px; }
        
        /* Master Controls Panel */
        .master-controls { background: var(--bg-panel); border-radius: 12px; border: 2px solid #1e293b; padding: 25px; display: flex; flex-direction: column; gap: 25px; }
        
        .section-title { color: var(--neon-blue); font-size: 1.2rem; margin-bottom: 15px; letter-spacing: 1px; border-bottom: 2px solid #1e293b; padding-bottom: 5px; }
        
        /* AI Voice */
        .btn-ai-voice { width: 100%; background: var(--gold); color: #000; border: none; padding: 20px; border-radius: 8px; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .ai-result { width: 100%; background: #000; border: 2px solid #334155; color: var(--gold); margin-top: 15px; padding: 15px; border-radius: 6px; font-size: 1.1rem; resize: none; outline: none; font-family: Arial, sans-serif; text-transform: none; }

        /* Tools Grid */
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-tool { background: #1e293b; border: 2px solid #334155; color: white; padding: 15px 10px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; text-align: center; }
        .btn-tool:hover { border-color: var(--neon-blue); color: var(--neon-blue); }
        .input-box { background: #000; border: 2px solid #334155; color: white; padding: 15px; border-radius: 6px; width: 100%; font-size: 1rem; margin-top: 10px; outline: none; }

        /* Universal Converter & Export */
        .converter-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .select-format { flex: 2; background: #000; border: 2px solid #334155; color: white; padding: 15px; border-radius: 6px; font-size: 1rem; outline: none; }
        .btn-convert { flex: 1; background: var(--neon-blue); color: #000; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        
        .btn-export { width: 100%; background: transparent; border: 3px solid var(--neon-blue); color: var(--neon-blue); padding: 20px; border-radius: 8px; font-size: 1.4rem; cursor: pointer; }
        .btn-export:hover { background: var(--neon-blue); color: #000; }

        /* Canvas Workspace */
        .workspace { background: #ffffff; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 3px solid #334155; min-height: 700px; position: relative; }
        
        .canvas-toolbar { background: var(--bg-panel); padding: 15px 20px; display: flex; gap: 20px; border-bottom: 3px solid #1e293b; }
        .canvas-btn { background: transparent; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        .canvas-btn:hover { color: var(--neon-blue); }
        
        .drafting-area { flex: 1; background-image: linear-gradient(#e2e8f0 2px, transparent 2px), linear-gradient(90deg, #e2e8f0 2px, transparent 2px); background-size: 50px 50px; position: relative; overflow: hidden; }
        
        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: var(--bg-panel); width: 100%; max-width: 600px; border-radius: 12px; border: 3px solid var(--neon-blue); padding: 40px; text-align: center; position: relative; }
        .btn-close { position: absolute; top: 15px; right: 20px; background: transparent; border: none; color: white; font-size: 2rem; cursor: pointer; }
        
        .payment-btn { width: 100%; padding: 20px; border-radius: 8px; font-size: 1.5rem; border: none; cursor: pointer; margin-top: 15px; display: none; }
        #btnUPI { background: var(--upi); color: white; }
        #btnPayPal { background: var(--paypal); color: white; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-logo">DesignHub<span>.AI</span></div>
        <div class="header-controls">
            <select class="select-box"><option>🌍 ANY LANGUAGE</option><option>ENGLISH</option><option>HINDI</option></select>
            <select id="currency" class="select-box" onchange="updateGateway()"><option value="INR">🇮🇳 INR (₹)</option><option value="USD">🇺🇸 USD ($)</option></select>
            <button class="btn-google" onclick="alert('Google API Auth Trigger Here')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20" alt="G"> LOGIN
            </button>
        </div>
    </header>

    <!-- Studio -->
    <section class="ultimate-studio">
        
        <!-- Left Panel: All Tools -->
        <div class="master-controls">
            
            <!-- Voice AI -->
            <div>
                <div class="section-title">1. AI VOICE ENGINE</div>
                <button class="btn-ai-voice" onclick="alert('Listening via Speech API...')">🎤 SPEAK TO DESIGN</button>
                <textarea class="ai-result" rows="2" placeholder="AI WILL TRANSCRIBE AND RESPOND HERE..."></textarea>
            </div>

            <!-- Smart Tools & Scanning -->
            <div>
                <div class="section-title">2. SMART TOOLS & SCAN</div>
                <div class="tools-grid">
                    <button class="btn-tool">📸 BG REMOVER</button>
                    <button class="btn-tool">🔍 SCAN TO VECTOR</button>
                </div>
                <input type="text" class="input-box" placeholder="FETCH LOGO (E.G. NIKE)">
            </div>

            <!-- Dimensions -->
            <div>
                <div class="section-title">3. DIMENSIONS</div>
                <div style="display: flex; gap: 10px;">
                    <input type="number" class="input-box" placeholder="W" style="margin: 0;">
                    <input type="number" class="input-box" placeholder="H" style="margin: 0;">
                    <select class="select-box" style="width: 100%;"><option>INCH</option><option>FEET</option><option>MM</option></select>
                </div>
            </div>

            <!-- Universal Converter (FIXED & ADDED BACK) -->
            <div style="margin-top: auto;">
                <div class="section-title">4. UNIVERSAL CONVERTER</div>
                <div class="converter-box">
                    <select class="select-format">
                        <option>CDR (COREL DRAW)</option>
                        <option>DXF (AUTOCAD)</option>
                        <option>SVG (VECTOR)</option>
                        <option>PDF (PRINT)</option>
                    </select>
                    <button class="btn-convert" onclick="alert('Converting format...')">CONVERT</button>
                </div>
                <button class="btn-export" onclick="document.getElementById('checkoutModal').style.display='flex'">EXPORT FILE ⬇️</button>
            </div>
        </div>

        <!-- Right Panel: Canvas -->
        <div class="workspace">
            <div class="canvas-toolbar">
                <button class="canvas-btn" style="color: var(--neon-blue);">👆 SELECT</button>
                <button class="canvas-btn">✍️ DRAW LOGO</button>
                <button class="canvas-btn">T TEXT</button>
                <button class="canvas-btn" style="color: var(--neon-red);">⚏ HAIRLINE</button>
                <button class="canvas-btn" style="color: var(--upi);">✂️ CUT PATH</button>
            </div>
            
            <div class="drafting-area">
                <h1 style="color: rgba(0,0,0,0.1); font-size: 5rem; text-align: center; margin-top: 250px;">LIVE CANVAS AREA</h1>
            </div>
        </div>
    </section>

    <!-- Payment Gateway Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <button class="btn-close" onclick="document.getElementById('checkoutModal').style.display='none'">×</button>
            <h2 style="color: var(--gold); font-size: 2.5rem; margin-bottom: 10px;">SECURE CHECKOUT</h2>
            <p style="color: #94a3b8; font-size: 1.2rem; margin-bottom: 30px;">PAY TO DOWNLOAD CONVERTED FILE</p>
            
            <h1 id="priceTag" style="font-size: 4rem; color: white; margin-bottom: 20px;">₹99</h1>
            
            <button id="btnUPI" class="payment-btn" style="display: block;">⚡ PAY VIA UPI</button>
            <button id="btnPayPal" class="payment-btn">💳 PAY VIA PAYPAL</button>
        </div>
    </div>

    <script>
        // Currency Toggle Logic for Checkout
        function updateGateway() {
            const currency = document.getElementById('currency').value;
            if(currency === 'USD') {
                document.getElementById('priceTag').innerText = '$2.99';
                document.getElementById('btnUPI').style.display = 'none';
                document.getElementById('btnPayPal').style.display = 'block';
            } else {
                document.getElementById('priceTag').innerText = '₹99';
                document.getElementById('btnUPI').style.display = 'block';
                document.getElementById('btnPayPal').style.display = 'none';
            }
        }
    </script>
</body>
</html>
